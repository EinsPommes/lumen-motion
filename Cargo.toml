[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.84"

[workspace.dependencies]
lumen-core = { path = "crates/core" }
lumen-anim = { path = "crates/anim" }
lumen-render = { path = "crates/render" }
lumen-text = { path = "crates/text" }
lumen-particles = { path = "crates/particles" }
lumen-media = { path = "crates/media" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
glam = { version = "0.29", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytemuck = "1"
# wgpu must match the version egui-wgpu (eframe) is built against.
wgpu = "24"
eframe = { version = "0.31", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
todo = "warn"

# Optimise dependencies even in debug builds: wgpu/egui are slow unoptimised.
[profile.dev.package."*"]
opt-level = 2
